<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto AI — Reset Password · Powered by Sri Saamba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800&family=Instrument+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  :root {
    --bg: #F7F6F2; --surface: #FFFFFF; --surface2: #F0EFE9;
    --ink: #1A1916; --ink2: #6B6860; --ink3: #A8A69E;
    --border: rgba(0,0,0,.07); --border2: rgba(0,0,0,.12);
    --orange: #FF5C1A; --green: #1A7A50; --red: #C02B2B;
    --radius: 10px; --radius-lg: 16px;
    --font: 'Cabinet Grotesk', sans-serif;
    --mono: 'Instrument Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font); background: var(--bg); color: var(--ink);
    min-height: 100vh; display: flex; justify-content: center;
    align-items: center; padding: 20px;
  }
  .box {
    background: var(--surface); border: 1px solid var(--border);
    padding: 36px 32px; border-radius: var(--radius-lg);
    width: 100%; max-width: 380px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 24px rgba(0,0,0,.06);
  }
  .logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .logo-mark { width: 36px; height: 36px; background: var(--orange); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: white; }
  .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
  .logo-text span { color: var(--orange); }
  .subtitle { text-align: center; font-size: 12px; color: var(--ink3); font-family: var(--mono); margin-bottom: 26px; }
  label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink3); font-family: var(--mono); margin-bottom: 5px; }
  input { width: 100%; padding: 11px 13px; margin-bottom: 16px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius); font-size: 14px; font-family: var(--font); color: var(--ink); outline: none; transition: border-color .15s, background .15s; }
  input:focus { border-color: var(--orange); background: var(--surface); }
  input::placeholder { color: var(--ink3); }
  button.primary { width: 100%; padding: 12px; background: var(--orange); color: white; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700; font-family: var(--font); cursor: pointer; transition: background .15s, opacity .15s; }
  button.primary:hover { background: #e04800; }
  button.primary:disabled { opacity: .6; cursor: not-allowed; }
  #message { text-align: center; margin-top: 14px; font-size: 13px; line-height: 1.5; min-height: 20px; }
  #message.error { color: var(--red); }
  #message.success { color: var(--green); }
  .back-link { text-align: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--ink2); }
  .back-link a { color: var(--orange); font-weight: 700; text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="box">
  <div class="logo">
    <div class="logo-mark">AA</div>
    <div class="logo-text">Auto <span>AI</span></div>
  </div>
  <div style="text-align:center;font-size:10px;color:var(--ink3);font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px;">Powered by Sri Saamba</div>
  <p class="subtitle" id="subtitle">Verifying reset link…</p>

  <label for="new-password">New Password</label>
  <input type="password" id="new-password" placeholder="Min 8 characters" autocomplete="new-password">

  <label for="confirm-password">Confirm New Password</label>
  <input type="password" id="confirm-password" placeholder="Repeat new password" autocomplete="new-password">

  <button class="primary" id="reset-btn" onclick="handlePasswordReset()" disabled>Update Password</button>

  <p id="message"></p>

  <div class="back-link">
    <a href="login.html">Back to Sign in</a>
  </div>
</div>

<script>
  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.innerText = text;
    el.className = type || '';
  }

  function setSubtitle(text) {
    const el = document.getElementById('subtitle');
    if (el) el.innerText = text;
  }

  function markExpired(reason) {
    setSubtitle('Link invalid or expired');
    setMessage(reason || 'This reset link has expired or already been used. Please request a new one.', 'error');
    document.getElementById('reset-btn').disabled = true;
  }

  // ── Detect whether this page carries a valid recovery token ──────────────
  // Supabase implicit flow: #access_token=...&type=recovery
  // Supabase PKCE flow:     ?code=...
  const _hashParams  = new URLSearchParams(window.location.hash.replace('#', ''));
  const _queryParams = new URLSearchParams(window.location.search);
  const _hasToken    = _hashParams.get('type') === 'recovery' || _queryParams.has('code');

  if (!_hasToken) {
    // User navigated directly to this page without a recovery token
    markExpired('No reset token found. Please use the link from your email or request a new one.');
  }

  // ── Timeout guard — if PASSWORD_RECOVERY never fires within 8s, token is
  //    expired or the PKCE verifier is missing (cross-device link open) ─────
  let _recoveryReady = false;
  const _expireTimer = _hasToken ? setTimeout(() => {
    if (!_recoveryReady) markExpired();
  }, 8000) : null;

  // ── Auth state listener ──────────────────────────────────────────────────
  // PASSWORD_RECOVERY is the only event that should unlock this form.
  // We deliberately ignore SIGNED_IN, SIGNED_OUT, INITIAL_SESSION, and
  // TOKEN_REFRESHED — none of those should redirect or alter this page.
  supa.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      _recoveryReady = true;
      clearTimeout(_expireTimer);
      setSubtitle('Set your new password');
      setMessage('', '');
      document.getElementById('reset-btn').disabled = false;
    }
    // No redirect on any other event — this page must stay put until
    // the user either completes the flow or sees an expired-link message.
  });

  // ── Update password ──────────────────────────────────────────────────────
  async function handlePasswordReset() {
    if (!_recoveryReady) {
      setMessage('Recovery session not ready. Please use the link from your email.', 'error');
      return;
    }

    const newPassword     = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const btn             = document.getElementById('reset-btn');

    setMessage('', '');

    if (newPassword.length < 8) {
      setMessage('Password must be at least 8 characters.', 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      setMessage('Passwords do not match.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Updating…';

    const { error } = await supa.auth.updateUser({ password: newPassword });

    if (error) {
      setMessage('Update failed: ' + error.message, 'error');
      btn.disabled = false;
      btn.innerText = 'Update Password';
    } else {
      setMessage('Password updated successfully. Redirecting to sign in…', 'success');
      // Sign out the temporary recovery session before redirecting
      await supa.auth.signOut();
      setTimeout(() => { window.location.replace('login.html'); }, 2000);
    }
  }

  document.getElementById('confirm-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handlePasswordReset();
  });
</script>

</body>
</html>
