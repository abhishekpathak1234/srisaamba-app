<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Saamba AI — Set up your dealership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800&family=Instrument+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --surface2: #F0EFE9;
    --ink: #1A1916;
    --ink2: #6B6860;
    --ink3: #A8A69E;
    --border: rgba(0,0,0,.07);
    --border2: rgba(0,0,0,.12);
    --orange: #FF5C1A;
    --green: #1A7A50;
    --red: #C02B2B;
    --radius: 10px;
    --radius-lg: 16px;
    --font: 'Cabinet Grotesk', sans-serif;
    --mono: 'Instrument Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 36px 32px;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 420px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 24px rgba(0,0,0,.06);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    justify-content: center;
    margin-bottom: 6px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--orange);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: white;
  }
  .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
  .logo-text span { color: var(--orange); }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: var(--ink3);
    font-family: var(--mono);
    margin-bottom: 26px;
  }
  label {
    display: block;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink3); font-family: var(--mono);
    margin-bottom: 5px;
  }
  input, select {
    width: 100%;
    padding: 11px 13px;
    margin-bottom: 16px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: var(--font);
    color: var(--ink);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  input:focus, select:focus { border-color: var(--orange); background: var(--surface); }
  input::placeholder { color: var(--ink3); }
  select {
    appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 13px center;
  }
  button.primary {
    width: 100%;
    padding: 12px;
    background: var(--orange);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 14px; font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button.primary:hover { background: #e04800; }
  button.primary:disabled { opacity: .6; cursor: not-allowed; }
  #message {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.5;
    min-height: 20px;
  }
  #message.error { color: var(--red); }
  #message.success { color: var(--green); }
  .switch-mode {
    text-align: center;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--ink2);
  }
  .switch-mode a {
    color: var(--orange);
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .switch-mode a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">
    <div class="logo-mark">SS</div>
    <div class="logo-text">Sri<span>Saamba</span> AI</div>
  </div>
  <p class="subtitle">Set up your dealership</p>

  <label for="d-name">Dealership name *</label>
  <input id="d-name" placeholder="e.g. Mike's Motors" autocomplete="organization">

  <label for="d-logo">Logo URL</label>
  <input id="d-logo" placeholder="https://… (optional)">

  <label for="d-website">Website</label>
  <input id="d-website" placeholder="https://yourdealership.com">

  <label for="d-phone">Phone</label>
  <input id="d-phone" placeholder="+1 713 555 0100" autocomplete="tel">

  <label for="d-address">Address</label>
  <input id="d-address" placeholder="4521 Highway 6, Houston TX">

  <label for="d-timezone">Timezone</label>
  <select id="d-timezone"></select>

  <label for="d-hours">Business hours</label>
  <input id="d-hours" placeholder="Mon–Sat 9am–7pm, Sun 11am–5pm">

  <label for="d-plan">Plan</label>
  <select id="d-plan">
    <option value="starter" selected>Starter — free trial</option>
    <option value="growth">Growth</option>
  </select>

  <button class="primary" id="create-btn" onclick="createDealership()">Create dealership</button>

  <p id="message"></p>

  <div class="switch-mode">
    Wrong account? <a onclick="signOutToLogin()">Sign out</a>
  </div>
</div>

<script>
  // Hide until we know the user belongs here (signed in, not yet onboarded)
  document.documentElement.style.visibility = 'hidden';

  (async () => {
    const session = await getSession();
    if (!session) { window.location.replace('login.html'); return; }

    // Already onboarded (or invited and joined)? No duplicate onboarding.
    if (await getMembership()) { window.location.replace('dashboard.html'); return; }

    populateTimezones();
    document.documentElement.style.visibility = 'visible';
  })();

  function populateTimezones() {
    const sel = document.getElementById('d-timezone');
    const browserTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const zones = (typeof Intl.supportedValuesOf === 'function')
      ? Intl.supportedValuesOf('timeZone')
      : ['America/New_York', 'America/Chicago', 'America/Denver',
         'America/Los_Angeles', 'America/Phoenix', 'Asia/Kolkata', 'UTC'];
    for (const z of zones) {
      const opt = document.createElement('option');
      opt.value = z;
      opt.textContent = z;
      if (z === browserTz) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.innerText = text;
    el.className = type;
  }

  async function createDealership() {
    const name = document.getElementById('d-name').value.trim();
    const btn = document.getElementById('create-btn');

    if (!name) {
      setMessage('Dealership name is required.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Creating…';
    setMessage('', '');

    const hours = document.getElementById('d-hours').value.trim();

    const { error } = await supa.rpc('create_dealership', {
      p_name: name,
      p_logo_url: document.getElementById('d-logo').value.trim() || null,
      p_website: document.getElementById('d-website').value.trim() || null,
      p_phone: document.getElementById('d-phone').value.trim() || null,
      p_address: document.getElementById('d-address').value.trim() || null,
      p_timezone: document.getElementById('d-timezone').value || null,
      p_business_hours: hours ? { display: hours } : null,
      p_subscription_plan: document.getElementById('d-plan').value
    });

    if (error) {
      if (/already belong/i.test(error.message)) {
        // Membership appeared meanwhile (e.g. invite accepted in another tab)
        window.location.replace('dashboard.html');
        return;
      }
      setMessage(error.message, 'error');
      btn.disabled = false;
      btn.innerText = 'Create dealership';
    } else {
      window.location.replace('dashboard.html');
    }
  }

  async function signOutToLogin() {
    await supa.auth.signOut();
    window.location.replace('login.html');
  }
</script>

</body>
</html>
