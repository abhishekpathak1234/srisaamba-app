<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Saamba AI — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;600;700;800&family=Instrument+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --surface2: #F0EFE9;
    --ink: #1A1916;
    --ink2: #6B6860;
    --ink3: #A8A69E;
    --border: rgba(0,0,0,.07);
    --border2: rgba(0,0,0,.12);
    --orange: #FF5C1A;
    --green: #1A7A50;
    --red: #C02B2B;
    --radius: 10px;
    --radius-lg: 16px;
    --font: 'Cabinet Grotesk', sans-serif;
    --mono: 'Instrument Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 36px 32px;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 380px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 24px rgba(0,0,0,.06);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    justify-content: center;
    margin-bottom: 6px;
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--orange);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: white;
  }
  .logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
  .logo-text span { color: var(--orange); }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: var(--ink3);
    font-family: var(--mono);
    margin-bottom: 26px;
  }
  label {
    display: block;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink3); font-family: var(--mono);
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    padding: 11px 13px;
    margin-bottom: 16px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    font-size: 14px;
    font-family: var(--font);
    color: var(--ink);
    outline: none;
    transition: border-color .15s, background .15s;
  }
  input:focus { border-color: var(--orange); background: var(--surface); }
  input::placeholder { color: var(--ink3); }
  button.primary {
    width: 100%;
    padding: 12px;
    background: var(--orange);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 14px; font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  button.primary:hover { background: #e04800; }
  button.primary:disabled { opacity: .6; cursor: not-allowed; }
  .divider {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px;
    font-size: 11px;
    color: var(--ink3);
    font-family: var(--mono);
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  button.google {
    width: 100%;
    margin-top: 14px;
    padding: 11px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    font-size: 14px; font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: background .15s, border-color .15s;
  }
  button.google:hover { background: var(--surface2); }
  #message {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    line-height: 1.5;
    min-height: 20px;
  }
  #message.error { color: var(--red); }
  #message.success { color: var(--green); }
  .switch-mode {
    text-align: center;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--ink2);
  }
  .switch-mode a {
    color: var(--orange);
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .switch-mode a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-box">
  <div class="logo">
    <div class="logo-mark">SS</div>
    <div class="logo-text">Sri<span>Saamba</span> AI</div>
  </div>
  <p class="subtitle" id="subtitle">Sign in to your dashboard</p>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

  <button class="primary" id="submit-btn" onclick="handleSubmit()">Sign in</button>

  <div class="divider">or</div>

  <button class="google" onclick="loginWithGoogle()">
    <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
    Continue with Google
  </button>

  <p id="message"></p>

  <div class="switch-mode" id="switch-mode">
    Don't have an account? <a onclick="toggleMode()">Create one</a>
  </div>
</div>

<script>
  let mode = 'login'; // 'login' or 'signup'

  // Already signed in? Go straight to the dashboard
  (async () => {
    if (await getSession()) routeAfterAuth();
  })();

  function toggleMode() {
    mode = mode === 'login' ? 'signup' : 'login';
    document.getElementById('subtitle').innerText =
      mode === 'login' ? 'Sign in to your dashboard' : 'Create your account';
    document.getElementById('submit-btn').innerText =
      mode === 'login' ? 'Sign in' : 'Create account';
    document.getElementById('switch-mode').innerHTML =
      mode === 'login'
        ? `Don't have an account? <a onclick="toggleMode()">Create one</a>`
        : `Already have an account? <a onclick="toggleMode()">Sign in</a>`;
    setMessage('', '');
  }

  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.innerText = text;
    el.className = type;
  }

  async function handleSubmit() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submit-btn');

    if (!email || !password) {
      setMessage('Enter your email and password.', 'error');
      return;
    }
    if (mode === 'signup' && password.length < 6) {
      setMessage('Password must be at least 6 characters.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerText = mode === 'login' ? 'Signing in…' : 'Creating account…';
    setMessage('', '');

    if (mode === 'login') {
      const { error } = await supa.auth.signInWithPassword({ email, password });
      if (error) {
        setMessage('Invalid email or password.', 'error');
        btn.disabled = false;
        btn.innerText = 'Sign in';
      } else {
        await routeAfterAuth();
      }
    } else {
      const { data, error } = await supa.auth.signUp({ email, password });
      btn.disabled = false;
      btn.innerText = 'Create account';
      if (error) {
        setMessage(error.message, 'error');
      } else if (data.session) {
        // Email confirmation disabled — signed in immediately
        await routeAfterAuth();
      } else {
        // Email confirmation enabled — user must verify first
        setMessage('Account created! Check your email to confirm, then sign in.', 'success');
        toggleMode();
      }
    }
  }

  async function loginWithGoogle() {
    setMessage('', '');
    // Comes back to this page; the session check above then goes to the dashboard
    const { error } = await supa.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) setMessage(error.message, 'error');
  }

  // Submit on Enter key
  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });
  document.getElementById('email').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });
</script>

</body>
</html>
